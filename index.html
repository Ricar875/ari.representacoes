<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARI Representações Multimarcas | Aracaju - SE</title>
<meta name="description" content="Representação comercial em Aracaju/SE: artigos de festas, decorações, brinquedos e utilidades domésticas para lojistas.">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F3F; --navy2:#13305F; --gold:#B98A4B; --gold2:#D4A968;
  --bg:#F7F5F0; --alt:#ECEEF1; --card:#fff; --ink:#14213A; --muted:#5A6577; --line:#DADFE6;
  --ontext:#EAF0FA;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1730;--alt:#0E1F3D;--card:#12284B;--ink:#EAF0FA;--muted:#A9B6CC;--line:#23406E}}
:root[data-theme="dark"]{--bg:#0A1730;--alt:#0E1F3D;--card:#12284B;--ink:#EAF0FA;--muted:#A9B6CC;--line:#23406E}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(78px + env(safe-area-inset-top,0px))}
body{margin:0;font-family:Montserrat,Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px}
img,svg{max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
h1,h2,h3{line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:800}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;font-weight:700;font-size:.98rem;border:2px solid transparent;transition:transform .2s,background .2s}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0B1F3F;box-shadow:0 8px 24px -8px rgba(185,138,75,.7)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-line{border-color:rgba(234,240,250,.45);color:var(--ontext)}
.btn-line:hover{background:rgba(255,255,255,.08)}
/* header */
.top{background:var(--navy);color:var(--ontext);font-size:.82rem}
.top .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
header{position:sticky;top:0;z-index:50;background:rgba(11,31,63,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(212,169,104,.35);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:12px;color:#fff}
.logo b{display:grid;place-items:center;width:44px;height:44px;border:2px solid var(--gold2);border-radius:10px;font-weight:800;color:var(--gold2);letter-spacing:.04em}
.logo span{font-size:.78rem;line-height:1.25;color:var(--ontext)}
.logo span strong{display:block;font-size:.98rem;color:#fff}
nav{display:flex;gap:28px;font-size:.92rem;font-weight:600;color:var(--ontext)}
nav a:hover{color:var(--gold2)}
header .btn{padding:11px 20px;font-size:.88rem}
/* hero */
.hero{background:radial-gradient(900px 500px at 85% 20%,var(--navy2),transparent 70%),var(--navy);color:var(--ontext);padding:84px 0 96px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.1rem,5vw,3.6rem);font-weight:800;color:#fff;max-width:15ch}
.hero p{font-size:1.1rem;max-width:52ch;margin:22px 0 32px;color:#C9D6EC}
.hero .cta{display:flex;flex-wrap:wrap;gap:14px}
.hero small{display:block;margin-top:18px;color:#9FB1CD}
.hero svg{width:100%;height:auto;max-width:420px;justify-self:center}
/* sections */
section{padding:88px 0}
.alt{background:var(--alt)}
.head{max-width:680px;margin-bottom:46px}
.head p{color:var(--muted);margin:14px 0 0}
.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about p{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stats div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:22px}
.stats strong{display:block;font-size:1.05rem}
.stats span{font-size:.9rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 24px;transition:transform .25s,box-shadow .25s,border-color .25s;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 40px -22px rgba(11,31,63,.55);border-color:var(--gold)}
.card:hover::after{width:100%}
.ico{width:64px;height:64px;border-radius:16px;background:var(--navy);display:grid;place-items:center;margin-bottom:20px}
.ico svg{width:34px;height:34px;stroke:var(--gold2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.15rem;margin-bottom:8px}
.card p{margin:0 0 16px;color:var(--muted);font-size:.93rem}
.card a{font-weight:700;color:var(--gold);font-size:.9rem}
.why{background:var(--navy);color:var(--ontext)}
.why h2{color:#fff}.why .head p{color:#B6C4DC}
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.why-grid div{border:1px solid rgba(212,169,104,.35);border-radius:16px;padding:26px 22px;background:rgba(255,255,255,.03)}
.why-grid h3{color:var(--gold2);font-size:1.05rem;margin-bottom:8px}
.why-grid p{margin:0;font-size:.92rem;color:#C9D6EC}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.t{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.t .stars{color:var(--gold);letter-spacing:3px;font-size:.95rem}
.t p{margin:0;font-size:.92rem}
.t footer{margin-top:auto;font-size:.82rem;color:var(--muted);line-height:1.4}
.t footer b{display:block;color:var(--ink);font-size:.9rem}
.final{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;text-align:center;padding:84px 0}
.final h2{color:#fff;max-width:22ch;margin:0 auto 14px}
.final p{color:#C9D6EC;max-width:56ch;margin:0 auto 30px}
footer.site{background:#07142B;color:#B6C4DC;padding:56px 0 28px;font-size:.92rem}
footer.site .wrap{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:36px}
footer.site h4{color:#fff;margin:0 0 12px;font-size:1rem}
footer.site p{margin:0 0 8px}
footer.site a:hover{color:var(--gold2)}
.seals{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.seals span{border:1px solid rgba(212,169,104,.5);color:var(--gold2);border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:600}
.copy{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.1);padding-top:20px;font-size:.82rem}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;background:#25D366;color:#063;font-weight:700;padding:13px 20px;border-radius:999px;box-shadow:0 12px 28px -8px rgba(0,0,0,.45)}
.wa svg{width:24px;height:24px;fill:#063}

.hero{text-align:center;padding:64px 0 80px}
.hero .wrap{display:block}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:34px}
.emblem{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;font-weight:800;letter-spacing:.06em;color:var(--gold2);border:3px solid var(--gold2);box-shadow:0 0 0 8px rgba(212,169,104,.15),inset 0 0 30px rgba(212,169,104,.15);background:var(--navy)}
.emblem{width:230px;height:230px;object-fit:cover;background:#fff;padding:0;border:4px solid var(--gold2);box-shadow:0 0 0 10px rgba(212,169,104,.18),0 24px 50px -20px rgba(0,0,0,.6)}
.hlogo{width:50px;height:50px;border-radius:50%;background:#fff;border:2px solid var(--gold2);object-fit:cover}
.brand em{margin-top:16px;font-size:1.05rem}
@media (max-width:640px){.emblem{width:180px;height:180px}}
.brand strong{font-size:1.5rem;color:#fff;margin-top:12px}
.brand em{font-style:normal;color:var(--gold2);font-weight:600}
.hero h1{max-width:20ch;margin:0 auto}
.hero p{margin:20px auto 30px}
.hero .cta{justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:56px}
.tile{background:rgba(255,255,255,.05);border:1px solid rgba(212,169,104,.4);border-radius:18px;padding:18px 14px 16px;transition:transform .25s,background .25s}
.tile:hover{transform:translateY(-5px);background:rgba(255,255,255,.1)}
.tile svg{width:100%;height:auto;display:block}
.tile span{display:block;margin-top:10px;font-weight:800;font-size:1.15rem;color:#fff}
.cards{grid-template-columns:repeat(2,1fr);gap:28px}
.card{padding:0}
.card .art{background:radial-gradient(circle at 50% 40%,var(--navy2),var(--navy));padding:26px 30px 16px}
.card .art svg{width:100%;height:210px;display:block}
.card .body{padding:28px 30px 32px}
.card h3{font-size:1.7rem;font-weight:800;margin-bottom:10px}
.card p{font-size:1.02rem}
.card a{font-size:.98rem}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.cards{grid-template-columns:1fr}.emblem{width:180px;height:180px}}
